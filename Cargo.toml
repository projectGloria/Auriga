[workspace]
resolver = "3"
members = ["src-tauri", "crates/core", "crates/helper-ipc", "crates/helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
auriga-core = { path = "crates/core" }
helper-ipc = { path = "crates/helper-ipc" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.20"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
windows = "0.62.2"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
