<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auriga — Driver Manager</title>
    <link rel="icon" href="/auriga.png" />
    <style>
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 42%, #13204a 0%, #0b0d12 60%); color: #e4e4e7; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        transition: opacity 0.3s ease; user-select: none; }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash img { width: 168px; height: 168px; border-radius: 28px; box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 20px 70px rgba(26,60,240,0.45); animation: splash-in 0.5s ease-out both; }
      #splash h1 { margin: 26px 0 0; font-size: 26px; font-weight: 600; letter-spacing: 0.04em; }
      #splash p { margin: 4px 0 0; font-size: 13px; color: #71717a; }
      #splash .bar { margin-top: 26px; width: 160px; height: 3px; border-radius: 3px; background: #27272a; overflow: hidden; }
      #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 3px; background: #3b5bff; animation: splash-bar 1.1s ease-in-out infinite; }
      @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
    </style>
  </head>
  <body>
    <div id="splash" data-tauri-drag-region>
      <img src="/auriga.png" alt="" draggable="false" />
      <h1>Auriga</h1>
      <p>Smart Driver Manager</p>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
