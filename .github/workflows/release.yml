name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run build and installer packaging without publishing a GitHub Release'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build Windows NSIS Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and verify version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tauriVersion = (Get-Content -Raw 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          $pkgVersion = (Get-Content -Raw 'package.json' | ConvertFrom-Json).version

          $cargoContent = Get-Content -Raw 'Cargo.toml'
          if ($cargoContent -match '(?ms)^\[workspace\.package\].*?^\s*version\s*=\s*"([^"]+)"') {
            $cargoVersion = $Matches[1]
          } else {
            throw 'Could not extract [workspace.package] version from Cargo.toml'
          }

          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $tagVersion = '${{ github.ref_name }}'.Substring(1)
            $mismatches = @()
            if ($tauriVersion -ne $tagVersion) { $mismatches += "src-tauri/tauri.conf.json ($tauriVersion)" }
            if ($pkgVersion -ne $tagVersion) { $mismatches += "package.json ($pkgVersion)" }
            if ($cargoVersion -ne $tagVersion) { $mismatches += "Cargo.toml ($cargoVersion)" }
            if ($mismatches.Count -gt 0) {
              throw "Tag version $tagVersion does not match manifests: $($mismatches -join ', ')"
            }
            $version = $tagVersion
          } else {
            $version = $tauriVersion
          }

          Write-Host "Resolved release version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Build Tauri NSIS installer
        shell: pwsh
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.version }}'
          $stagingDir = 'staging'
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null

          $installers = @(Get-ChildItem -Path 'target/release/bundle/nsis' -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly 1 NSIS installer in target/release/bundle/nsis, found $($installers.Count)"
          }

          $dest = Join-Path $stagingDir "Auriga-$version-x64-setup.exe"
          Copy-Item -Path $installers[0].FullName -Destination $dest
          Get-ChildItem -Path $stagingDir

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auriga-windows-x64
          path: staging/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
