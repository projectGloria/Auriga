<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Auriga — Offline Windows driver diagnostics, log correlation, and reversible fixes">
  <defs>
    <radialGradient id="leftGlow" cx="0%" cy="50%" r="55%" fx="0%" fy="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="1199" height="319" rx="18" />
    </clipPath>
  </defs>

  <!-- Card background -->
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="#111216" stroke="#262830" stroke-width="1" />

  <!-- Clipped decorative layers -->
  <g clip-path="url(#cardClip)">
    <!-- Left ambient glow -->
    <rect x="0" y="0" width="700" height="320" fill="url(#leftGlow)" />

    <!-- Right geometric diagonal lines -->
    <line x1="930" y1="-20" x2="1120" y2="340" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" />
    <line x1="990" y1="-20" x2="1180" y2="340" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1.5" />
    <line x1="1050" y1="-20" x2="1240" y2="340" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1.5" />
  </g>

  <!-- Left accent bar -->
  <rect x="4" y="40" width="8" height="240" rx="4" fill="#38BDF8" />

  <!-- Typography -->
  <text x="64" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#38BDF8" letter-spacing="-0.5">Auriga</text>
  <text x="64" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#D4D4D8">Offline Windows driver diagnostics, log correlation, and reversible fixes</text>

  <!-- Feature Pills -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#E4E4E7">
    <!-- Pill 1 -->
    <rect x="64" y="224" width="270" height="44" rx="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
    <circle cx="88" cy="246" r="5" fill="#38BDF8" />
    <text x="104" y="252">Device &amp; Driver Inventory</text>

    <!-- Pill 2 -->
    <rect x="350" y="224" width="238" height="44" rx="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
    <circle cx="374" cy="246" r="5" fill="#38BDF8" />
    <text x="390" y="252">YAML Rule Diagnostics</text>

    <!-- Pill 3 -->
    <rect x="604" y="224" width="228" height="44" rx="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
    <circle cx="628" cy="246" r="5" fill="#38BDF8" />
    <text x="644" y="252">Reversible UAC Fixes</text>

    <!-- Pill 4 -->
    <rect x="848" y="224" width="238" height="44" rx="10" fill="#181A20" stroke="#2C2F3A" stroke-width="1" />
    <circle cx="872" cy="246" r="5" fill="#38BDF8" />
    <text x="888" y="252">Event Log Correlation</text>
  </g>
</svg>
